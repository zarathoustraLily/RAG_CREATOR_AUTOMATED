<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du programme</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1d2430; --muted: #657083;
    --border: #d8dde4; --accent: #2563eb; --accent-soft: rgba(37, 99, 235, .12);
    --edge: #9aa6b8; --edge-label-halo: #f6f7f9; --warn: #b45309; --warn-soft: #fff4e5;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 6px 18px rgba(15, 23, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --surface: #171b22; --surface-2: #1f242d; --text: #e6e9ee; --muted: #9aa3b2;
      --border: #2c333e; --accent: #6ea8fe; --accent-soft: rgba(110, 168, 254, .16);
      --edge: #5c6779; --edge-label-halo: #0f1216; --warn: #f5a524; --warn-soft: #2a2110; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #171b22; --surface-2: #1f242d; --text: #e6e9ee; --muted: #9aa3b2;
    --border: #2c333e; --accent: #6ea8fe; --accent-soft: rgba(110, 168, 254, .16);
    --edge: #5c6779; --edge-label-halo: #0f1216; --warn: #f5a524; --warn-soft: #2a2110; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .1px; }
  header .sous-titre { color: var(--muted); font-size: 12.5px; }
  .titre { display: flex; flex-direction: column; margin-right: auto; min-width: 200px; }
  .outils { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .recherche { position: relative; }
  .recherche input {
    width: 260px; max-width: 70vw; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font: inherit;
  }
  .suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: 340px; max-width: 90vw;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    padding: 4px; display: none; max-height: 60vh; overflow: auto;
  }
  .suggestions.ouvert { display: block; }
  .suggestions button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 6px 8px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  .suggestions button:hover, .suggestions button.actif { background: var(--accent-soft); }
  .suggestions small { color: var(--muted); }
  button.bouton, select {
    font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button.bouton:hover { border-color: var(--accent); }
  label.bascule { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  #zone { position: relative; overflow: hidden; min-height: 0; }
  #zone svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
  #zone svg.glisse { cursor: grabbing; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 36px; height: 36px; padding: 0; font-size: 16px; }
  aside {
    border-left: 1px solid var(--border); background: var(--surface); overflow: auto; padding: 16px 18px 28px;
  }
  aside h2 { font-size: 17px; margin: 0 0 6px; word-break: break-word; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 8px; }
  aside p { margin: 6px 0; }
  .grille { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .grille dt { color: var(--muted); }
  .grille dd { margin: 0; word-break: break-word; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .variable { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .variable .desc { color: var(--muted); font-size: 13px; }
  .liens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: 12.5px; }
  .puce {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 999px;
    padding: 2px 9px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: pointer;
  }
  .puce:hover { border-color: var(--accent); }
  .puce.inerte { cursor: default; }
  .etiquette { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border); color: var(--muted); }
  .etiquette.realise { color: #15803d; border-color: #15803d; }
  .alerte { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .legende { display: grid; gap: 6px; font-size: 13px; }
  .legende span.carre { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .legende svg { vertical-align: middle; margin-right: 8px; }
  ol.etapes { padding-left: 22px; margin: 6px 0; }
  ol.etapes li { margin: 2px 0; cursor: pointer; }
  ol.etapes li.courante { font-weight: 600; color: var(--accent); }
  .parcours { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* SVG */
  .bande-titre { font-size: 15px; font-weight: 700; }
  .couloir-nom { font-size: 12.5px; fill: var(--muted); }
  .couloir-ligne { stroke: var(--border); stroke-width: 1; }
  .noeud rect.fond { fill: var(--surface); stroke-width: 1.4; }
  .noeud.prevu rect.fond { stroke-dasharray: 5 3; }
  .noeud text.nom { font-size: 12.5px; font-weight: 650; fill: var(--text); }
  .noeud text.meta { font-size: 11px; fill: var(--muted); }
  .noeud { cursor: pointer; transition: opacity .15s; }
  .noeud:hover rect.fond { stroke-width: 2.4; }
  .noeud.choisi rect.fond { stroke-width: 3; }
  .noeud.estompe { opacity: .22; }
  .flux path.trace { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: .75; transition: opacity .15s; }
  .flux.boucle path.trace { stroke-dasharray: 6 4; }
  .flux.appel path.trace, .flux.modele path.trace { stroke-dasharray: 2 3; }
  .flux.modele path.trace { opacity: .35; }
  .flux path.zone-clic { fill: none; stroke: transparent; stroke-width: 10; cursor: help; }
  .flux.actif path.trace { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
  .flux.estompe path.trace { opacity: .07; }
  .flux text { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--text);
    paint-order: stroke; stroke: var(--edge-label-halo); stroke-width: 4px; stroke-linejoin: round; display: none; pointer-events: none; }
  svg.variables-visibles .flux:not(.estompe) text, .flux.actif text { display: block; }
  svg.sans-boucles .flux.boucle { display: none; }
  .bulle {
    position: fixed; z-index: 30; pointer-events: none; max-width: 360px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; box-shadow: var(--shadow); display: none;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 44vh; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
    .recherche input { width: 200px; }
  }
</style>
</head>
<body>
<header>
  <div class="titre">
    <h1 id="titre">Carte du programme</h1>
    <span class="sous-titre" id="sous-titre"></span>
  </div>
  <div class="outils">
    <div class="recherche">
      <input id="recherche" type="search" placeholder="Chercher un script ou une variable…" autocomplete="off" aria-label="Chercher un script ou une variable">
      <div class="suggestions" id="suggestions" role="listbox"></div>
    </div>
    <label class="bascule"><input type="checkbox" id="voir-variables"> Noms des variables</label>
    <label class="bascule"><input type="checkbox" id="voir-boucles" checked> Boucles de retour</label>
    <label class="bascule"><input type="checkbox" id="voir-modele"> Appels au modèle</label>
    <button class="bouton" id="theme" title="Changer de thème">Thème</button>
  </div>
</header>
<main>
  <div id="zone">
    <svg id="carte" aria-label="Carte des scripts et de leurs flux">
      <defs>
        <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path>
        </marker>
      </defs>
      <g id="vue"></g>
    </svg>
    <div class="zoom">
      <button class="bouton" id="zoom-plus" aria-label="Zoomer">+</button>
      <button class="bouton" id="zoom-moins" aria-label="Dézoomer">−</button>
      <button class="bouton" id="zoom-ajuster" aria-label="Ajuster à l'écran" title="Ajuster à l'écran">⤢</button>
    </div>
  </div>
  <aside id="panneau" aria-live="polite"></aside>
</main>
<div class="bulle" id="bulle"></div>

<script src="donnees.js"></script>
<script>
(function () {
  "use strict";
  const D = window.CARTE;
  const panneau = document.getElementById("panneau");
  if (!D) {
    panneau.textContent = "Données absentes : lancez « python carte_du_programme/generer_carte.py ».";
    return;
  }

  // ───────────── outils
  const SVG = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, parent) {
    const e = document.createElementNS(SVG, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function el(tag, attrs, ...enfants) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "onclick") e.addEventListener("click", attrs[k]);
      else if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for (const c of enfants) if (c !== null && c !== undefined) e.append(c);
    return e;
  }
  const memo = {
    lire(cle, defaut) { try { const v = localStorage.getItem("carte." + cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } },
    ecrire(cle, v) { try { localStorage.setItem("carte." + cle, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
  };
  const tronquer = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);
  const nomFichier = (f) => (f || "").split("/").pop();

  // ───────────── données
  const moments = D.moments;
  const groupes = D.groupes;
  const groupeParId = Object.fromEntries(groupes.map((g) => [g.id, g]));
  const momentParId = Object.fromEntries(moments.map((m) => [m.id, m]));
  const scripts = D.scripts;
  const parId = Object.fromEntries(scripts.map((s) => [s.id, s]));
  scripts.forEach((s) => { s.moment = (groupeParId[s.groupe] || {}).moment; });
  const couleur = (s) => (momentParId[s.moment] || {}).couleur || "#888";
  const flux = D.flux.slice();
  if (parId.route_task) {
    scripts.filter((s) => s.modele && s.id !== "route_task").forEach((s) => {
      flux.push({ de: s.id, vers: "route_task", variables: [], type: "modele", boucle: false });
    });
  }
  const externes = D.entrees_externes || {};
  const producteurs = {}, consommateurs = {};
  scripts.forEach((s) => {
    Object.keys(s.sorties || {}).forEach((v) => (producteurs[v] = producteurs[v] || []).push(s.id));
    Object.keys(s.entrees || {}).forEach((v) => (consommateurs[v] = consommateurs[v] || []).push(s.id));
  });
  const toutesVariables = [...new Set([...Object.keys(producteurs), ...Object.keys(consommateurs), ...Object.keys(externes)])].sort();

  // ───────────── disposition : un bloc par moment, un couloir par groupe, colonnes = ordre
  const L = 196, H = 52, DX = 232, DY = 66, GAUCHE = 250, MARGE = 28, BANDE = 40;
  const pos = {}, blocs = [];
  let y = MARGE;
  for (const m of moments) {
    const ms = scripts.filter((s) => s.moment === m.id);
    if (!ms.length) continue;
    const colonnes = [...new Set(ms.map((s) => s.ordre))].sort((a, b) => a - b);
    const col = Object.fromEntries(colonnes.map((o, i) => [o, i]));
    const bloc = { m, haut: y, couloirs: [], colonnes: colonnes.length };
    y += BANDE;
    for (const g of groupes.filter((gr) => gr.moment === m.id)) {
      const gs = ms.filter((s) => s.groupe === g.id).sort((a, b) => a.ordre - b.ordre || a.id.localeCompare(b.id));
      if (!gs.length) continue;
      const pile = {}; let max = 1;
      for (const s of gs) {
        const c = col[s.ordre], k = pile[c] || 0;
        pile[c] = k + 1; max = Math.max(max, k + 1);
        pos[s.id] = { x: GAUCHE + c * DX, y: y + 12 + k * DY };
      }
      const h = max * DY + 16;
      bloc.couloirs.push({ g, y, h });
      y += h;
    }
    bloc.bas = y;
    blocs.push(bloc);
    y += MARGE;
  }
  const largeur = GAUCHE + Math.max(...blocs.map((b) => b.colonnes)) * DX + MARGE;
  const hauteur = y;

  // ───────────── dessin
  const svg = document.getElementById("carte");
  const vue = document.getElementById("vue");
  const fonds = sv("g", {}, vue), calqueFlux = sv("g", {}, vue), calqueNoeuds = sv("g", {}, vue);

  for (const b of blocs) {
    sv("rect", { x: 8, y: b.haut, width: largeur - 16, height: b.bas - b.haut, rx: 14, fill: b.m.couleur, "fill-opacity": .06, stroke: b.m.couleur, "stroke-opacity": .35 }, fonds);
    const t = sv("text", { x: 24, y: b.haut + 26, class: "bande-titre", fill: b.m.couleur }, fonds);
    t.textContent = b.m.nom + "  →  chronologie de gauche à droite";
    b.couloirs.forEach((c, i) => {
      if (i > 0) sv("line", { x1: 20, x2: largeur - 20, y1: c.y, y2: c.y, class: "couloir-ligne" }, fonds);
      const n = sv("text", { x: 24, y: c.y + 30, class: "couloir-nom" }, fonds);
      n.textContent = tronquer(c.g.nom, 34);
    });
  }

  const elFlux = [];
  function chemin(f) {
    const a = pos[f.de], b = pos[f.vers];
    const x1 = a.x + L, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const dx = Math.max(60, Math.abs(x2 - x1) / 2);
    const c1x = x1 + dx, c2x = x2 - dx;
    return { d: `M${x1},${y1} C${c1x},${y1} ${c2x},${y2} ${x2},${y2}`,
             mx: (x1 + 3 * c1x + 3 * c2x + x2) / 8, my: (y1 + 3 * y1 + 3 * y2 + y2) / 8 };
  }
  flux.forEach((f) => {
    if (!pos[f.de] || !pos[f.vers]) return;
    const c = chemin(f);
    const g = sv("g", { class: "flux " + f.type + (f.boucle ? " boucle" : "") }, calqueFlux);
    sv("path", { d: c.d, class: "trace", "marker-end": "url(#fleche)" }, g);
    const zone = sv("path", { d: c.d, class: "zone-clic" }, g);
    if (f.variables.length) {
      const t = sv("text", { x: c.mx, y: c.my - 4, "text-anchor": "middle" }, g);
      t.textContent = tronquer(f.variables.join(", "), 42);
    }
    const texte = f.type === "donnees"
      ? `${f.de} → ${f.vers} : ${f.variables.join(", ")}${f.boucle ? " (retour)" : ""}`
      : f.type === "appel" ? `${f.de} appelle ${f.vers}` : `${f.de} utilise un modèle (via ${f.vers})`;
    zone.addEventListener("mousemove", (e) => bulle(texte, e));
    zone.addEventListener("mouseleave", () => bulle(null));
    elFlux.push({ f, g });
  });

  const elNoeuds = {};
  scripts.forEach((s) => {
    const p = pos[s.id]; if (!p) return;
    const g = sv("g", { class: "noeud " + (s.statut === "realise" ? "realise" : "prevu"), transform: `translate(${p.x},${p.y})`, tabindex: 0, role: "button", "aria-label": s.id }, calqueNoeuds);
    sv("rect", { class: "fond", width: L, height: H, rx: 9, stroke: couleur(s) }, g);
    sv("rect", { width: 5, height: H, rx: 2, fill: couleur(s) }, g);
    const nom = sv("text", { x: 14, y: 21, class: "nom" }, g);
    nom.textContent = tronquer(s.id, 27);
    const meta = sv("text", { x: 14, y: 39, class: "meta" }, g);
    const morceaux = [nomFichier(s.fichier), s.session];
    if (s.modele && s.modele.prompt) morceaux.push(s.modele.prompt);
    meta.textContent = tronquer(morceaux.filter(Boolean).join(" · "), 34);
    g.addEventListener("click", (e) => { e.stopPropagation(); choisirScript(s.id); });
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choisirScript(s.id); } });
    g.addEventListener("mousemove", (e) => bulle(s.role, e));
    g.addEventListener("mouseleave", () => bulle(null));
    elNoeuds[s.id] = g;
  });

  // ───────────── bulle d'information
  const elBulle = document.getElementById("bulle");
  function bulle(texte, e) {
    if (!texte) { elBulle.style.display = "none"; return; }
    elBulle.textContent = texte;
    elBulle.style.display = "block";
    const x = Math.min(e.clientX + 14, window.innerWidth - elBulle.offsetWidth - 8);
    elBulle.style.left = x + "px";
    elBulle.style.top = (e.clientY + 14) + "px";
  }

  // ───────────── zoom et déplacement
  let v = { x: 0, y: 0, k: 1 };
  const appliquer = () => vue.setAttribute("transform", `translate(${v.x},${v.y}) scale(${v.k})`);
  const borne = (k) => Math.min(3, Math.max(0.1, k));
  function animer(cible) {
    const depart = { ...v }, t0 = performance.now(), duree = 320;
    function pas(t) {
      const u = Math.min(1, (t - t0) / duree), e = 1 - Math.pow(1 - u, 3);
      v = { x: depart.x + (cible.x - depart.x) * e, y: depart.y + (cible.y - depart.y) * e, k: depart.k + (cible.k - depart.k) * e };
      appliquer();
      if (u < 1) requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  }
  function ajuster(boite, anime) {
    const r = svg.getBoundingClientRect();
    const b = boite || { x: 0, y: 0, w: largeur, h: hauteur };
    const k = borne(Math.min(r.width / b.w, r.height / b.h) * 0.96);
    const cible = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };
    if (anime) animer(cible); else { v = cible; appliquer(); }
  }
  function boiteDe(ids) {
    const ps = ids.map((i) => pos[i]).filter(Boolean);
    const x0 = Math.min(...ps.map((p) => p.x)) - 60, y0 = Math.min(...ps.map((p) => p.y)) - 60;
    const x1 = Math.max(...ps.map((p) => p.x)) + L + 60, y1 = Math.max(...ps.map((p) => p.y)) + H + 60;
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  function vueInitiale() {
    v = { k: 0.8, x: 12, y: 12 };
    appliquer();
  }
  function centrer(id) {
    const p = pos[id], r = svg.getBoundingClientRect(), k = Math.max(v.k, 0.85);
    animer({ k, x: r.width / 2 - (p.x + L / 2) * k, y: r.height / 2 - (p.y + H / 2) * k });
  }
  function zoomer(f, cx, cy) {
    const r = svg.getBoundingClientRect();
    cx = cx === undefined ? r.width / 2 : cx; cy = cy === undefined ? r.height / 2 : cy;
    const k = borne(v.k * f);
    v = { k, x: cx - (cx - v.x) * (k / v.k), y: cy - (cy - v.y) * (k / v.k) };
    appliquer();
  }
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomer(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let glisse = null;
  svg.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".noeud")) return;
    glisse = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y, bouge: false };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (!glisse) return;
    const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { glisse.bouge = true; svg.classList.add("glisse"); }
    v.x = glisse.vx + dx; v.y = glisse.vy + dy; appliquer();
  });
  svg.addEventListener("pointerup", () => {
    if (glisse && !glisse.bouge) effacer();
    glisse = null; svg.classList.remove("glisse");
  });
  document.getElementById("zoom-plus").onclick = () => zoomer(1.25);
  document.getElementById("zoom-moins").onclick = () => zoomer(0.8);
  document.getElementById("zoom-ajuster").onclick = () => ajuster(null, true);

  // ───────────── mise en évidence
  function surligner(noeuds, liens) {
    Object.entries(elNoeuds).forEach(([id, g]) => {
      g.classList.toggle("estompe", !noeuds.has(id));
      g.classList.remove("choisi");
    });
    elFlux.forEach(({ f, g }) => {
      const actif = liens.has(f);
      g.classList.toggle("actif", actif);
      g.classList.toggle("estompe", !actif);
    });
  }
  function effacer() {
    Object.values(elNoeuds).forEach((g) => g.classList.remove("estompe", "choisi"));
    elFlux.forEach(({ g }) => g.classList.remove("actif", "estompe"));
    tournee = null;
    vueGenerale();
  }

  // ───────────── panneau : éléments réutilisables
  function puceScript(id) { return el("button", { class: "puce", onclick: () => { choisirScript(id); centrer(id); } }, id); }
  function puceVariable(nom) { return el("button", { class: "puce", onclick: () => choisirVariable(nom) }, nom); }
  function legende() {
    const l = el("div", { class: "legende" });
    moments.forEach((m) => l.append(el("div", {}, el("span", { class: "carre", style: "background:" + m.couleur }), m.nom)));
    const trait = (style, txt) => {
      const s = document.createElementNS(SVG, "svg"); s.setAttribute("width", "34"); s.setAttribute("height", "10");
      sv("line", { x1: 0, y1: 5, x2: 34, y2: 5, stroke: "currentColor", "stroke-width": 2, "stroke-dasharray": style }, s);
      return el("div", {}, s, txt);
    };
    l.append(trait("", "flux de données (nom des variables au survol)"));
    l.append(trait("6 4", "boucle de retour (une sortie revient plus tôt)"));
    l.append(trait("2 3", "appel d'un script ou d'un modèle"));
    l.append(el("div", {}, "Cadre en pointillés : script prévu · cadre plein : script réalisé"));
    return l;
  }

  // ───────────── vues du panneau
  function vueGenerale() {
    panneau.replaceChildren();
    const nbRealises = scripts.filter((s) => s.statut === "realise").length;
    panneau.append(
      el("h2", {}, "Comment lire cette carte"),
      el("p", {}, "Chaque cadre est un mini-script. Les blocs de couleur sont les moments du programme ; dans chaque bloc, le temps s'écoule de gauche à droite. Les flèches montrent quelles variables passent d'un script à l'autre."),
      el("p", {}, "Cliquez un script pour voir ses entrées, ses sorties et d'où elles viennent ; cherchez une variable pour suivre son trajet ; lancez un parcours pour voir le programme fonctionner pas à pas."),
      el("p", { class: "desc" }, "Glissez pour vous déplacer, molette pour zoomer, ⤢ (ou la touche 0) pour tout voir, Échap pour revenir ici."),
      el("h3", {}, "En chiffres"),
      el("dl", { class: "grille" },
        el("dt", {}, "Scripts"), el("dd", {}, `${scripts.length} (${nbRealises} réalisés, ${scripts.length - nbRealises} prévus)`),
        el("dt", {}, "Flux de données"), el("dd", {}, String(D.flux.filter((f) => f.type === "donnees").length)),
        el("dt", {}, "Variables"), el("dd", {}, String(toutesVariables.length)),
        el("dt", {}, "Entrées externes"), el("dd", {}, String(Object.keys(externes).length))),
      el("h3", {}, "Parcours guidés"),
      choixParcours(),
      el("h3", {}, "Aller à un moment"),
      el("div", { class: "liens" }, ...blocs.map((b) => el("button", { class: "puce", onclick: () => ajuster({ x: 0, y: b.haut, w: largeur, h: b.bas - b.haut }, true) }, b.m.nom))),
      el("h3", {}, "Légende"),
      legende()
    );
    if (D.problemes && D.problemes.length) {
      panneau.prepend(el("div", { class: "alerte" }, `${D.problemes.length} problème(s) de cohérence : `, el("ul", {}, ...D.problemes.map((p) => el("li", {}, p)))));
    }
  }

  function choisirScript(id) {
    const s = parId[id]; if (!s) return;
    const entrants = elFlux.filter(({ f }) => f.vers === id).map((x) => x.f);
    const sortants = elFlux.filter(({ f }) => f.de === id).map((x) => x.f);
    const voisins = new Set([id, ...entrants.map((f) => f.de), ...sortants.map((f) => f.vers)]);
    surligner(voisins, new Set([...entrants, ...sortants]));
    elNoeuds[id].classList.add("choisi");
    if (v.k < 0.6) centrer(id);
    afficherScript(s);
  }

  function afficherScript(s) {
    panneau.replaceChildren();
    const meta = el("dl", { class: "grille" },
      el("dt", {}, "Fichier"), el("dd", {}, el("code", {}, s.fichier || "—")),
      el("dt", {}, "Groupe"), el("dd", {}, (groupeParId[s.groupe] || {}).nom || s.groupe),
      el("dt", {}, "Moment"), el("dd", {}, (momentParId[s.moment] || {}).nom || "—"),
      el("dt", {}, "Ordre"), el("dd", {}, String(s.ordre)),
      el("dt", {}, "Session"), el("dd", {}, s.session || "—"));
    if (s.phase || s.etape) meta.append(el("dt", {}, "Phase / étape"), el("dd", {}, [s.phase, s.etape].filter(Boolean).join(" · ")));
    if (s.modele) meta.append(el("dt", {}, "Modèle"), el("dd", {}, `tâche ${s.modele.tache}` + (s.modele.prompt ? ` · prompt ${s.modele.prompt}` : "")));

    const entrees = el("div", {});
    Object.entries(s.entrees || {}).forEach(([nom, desc]) => {
      const sources = (producteurs[nom] || []).filter((p) => p !== s.id);
      const liens = el("div", { class: "liens" }, "vient de :");
      if (sources.length) sources.forEach((p) => liens.append(puceScript(p)));
      else liens.append(el("span", { class: "etiquette" }, "externe — " + (externes[nom] || "?")));
      entrees.append(el("div", { class: "variable" }, puceVariable(nom), " ", el("span", { class: "desc" }, desc), liens));
    });
    const sorties = el("div", {});
    Object.entries(s.sorties || {}).forEach(([nom, desc]) => {
      const cibles = (consommateurs[nom] || []).filter((c) => c !== s.id);
      const liens = el("div", { class: "liens" }, "va vers :");
      if (cibles.length) cibles.forEach((c) => liens.append(puceScript(c)));
      else liens.append(el("span", { class: "etiquette" }, "fin de chaîne"));
      sorties.append(el("div", { class: "variable" }, puceVariable(nom), " ", el("span", { class: "desc" }, desc), liens));
    });

    panneau.append(
      el("div", { class: "liens" }, el("button", { class: "puce", onclick: effacer }, "← vue d'ensemble"),
        el("span", { class: "etiquette" + (s.statut === "realise" ? " realise" : "") }, s.statut === "realise" ? "réalisé" : "prévu")),
      el("h2", {}, s.id),
      el("p", {}, s.role || ""),
      meta,
      el("h3", {}, "Entrées"), Object.keys(s.entrees || {}).length ? entrees : el("p", {}, "Aucune."),
      el("h3", {}, "Sorties"), Object.keys(s.sorties || {}).length ? sorties : el("p", {}, "Aucune.")
    );
    const tables = [["Lit", s.lit], ["Écrit", s.ecrit], ["Appelle", s.appelle]].filter(([, l]) => l && l.length);
    tables.forEach(([titre, liste]) => panneau.append(el("h3", {}, titre),
      el("div", { class: "liens" }, ...liste.map((x) => (parId[x] ? puceScript(x) : el("span", { class: "puce inerte" }, x))))));
  }

  function choisirVariable(nom) {
    const prods = producteurs[nom] || [], cons = consommateurs[nom] || [];
    const liens = new Set(elFlux.filter(({ f }) => f.variables.includes(nom)).map((x) => x.f));
    surligner(new Set([...prods, ...cons]), liens);
    if (prods.length + cons.length) ajuster(boiteDe([...prods, ...cons]), true);
    panneau.replaceChildren(
      el("div", { class: "liens" }, el("button", { class: "puce", onclick: effacer }, "← vue d'ensemble")),
      el("h2", {}, nom),
      el("p", {}, "Variable" + (externes[nom] ? " externe : " + externes[nom] : "")),
      el("h3", {}, "Produite par"),
      prods.length ? el("div", { class: "liens" }, ...prods.map(puceScript)) : el("p", {}, externes[nom] ? "l'extérieur (vous, un fichier, une machine)" : "aucun script"),
      el("h3", {}, "Utilisée par"),
      cons.length ? el("div", { class: "liens" }, ...cons.map(puceScript)) : el("p", {}, "aucun script (fin de chaîne)")
    );
  }

  // ───────────── parcours guidés
  let tournee = null, minuterie = null;
  function choixParcours() {
    const sel = el("select", { "aria-label": "Choisir un parcours" }, el("option", { value: "" }, "Choisir un parcours…"),
      ...(D.parcours || []).map((p) => el("option", { value: p.id }, p.nom)));
    sel.addEventListener("change", () => { if (sel.value) demarrerParcours(sel.value); });
    return el("div", { class: "parcours" }, sel);
  }
  function demarrerParcours(id) {
    const p = (D.parcours || []).find((x) => x.id === id); if (!p) return;
    tournee = { p, i: 0 };
    etape(0);
  }
  function etape(i) {
    if (!tournee) return;
    const n = tournee.p.etapes.length;
    tournee.i = Math.max(0, Math.min(n - 1, i));
    const id = tournee.p.etapes[tournee.i], avant = tournee.p.etapes[tournee.i - 1];
    const visites = new Set(tournee.p.etapes.slice(0, tournee.i + 1));
    const liens = new Set(elFlux.filter(({ f }) => (f.de === avant && f.vers === id) || (f.de === id && f.vers === avant)).map((x) => x.f));
    surligner(visites, liens);
    elNoeuds[id].classList.add("choisi");
    centrer(id);
    const s = parId[id];
    const transmis = [...liens].flatMap((f) => f.variables);
    panneau.replaceChildren(
      el("div", { class: "liens" }, el("button", { class: "puce", onclick: () => { arreterLecture(); effacer(); } }, "← quitter le parcours")),
      el("h2", {}, tournee.p.nom),
      el("p", {}, `Étape ${tournee.i + 1} sur ${n} : `, el("strong", {}, id)),
      el("p", {}, s.role || ""),
      transmis.length ? el("p", {}, "Reçoit de l'étape précédente : ", ...transmis.map((v) => el("code", {}, v + " "))) : null,
      el("div", { class: "parcours" },
        el("button", { class: "bouton", onclick: () => etape(tournee.i - 1) }, "◀ Précédent"),
        el("button", { class: "bouton", onclick: () => etape(tournee.i + 1) }, "Suivant ▶"),
        el("button", { class: "bouton", onclick: basculerLecture }, minuterie ? "Pause" : "Lecture auto")),
      el("h3", {}, "Étapes"),
      el("ol", { class: "etapes" }, ...tournee.p.etapes.map((e, k) => {
        const li = el("li", { class: k === tournee.i ? "courante" : "" }, e);
        li.addEventListener("click", () => etape(k));
        return li;
      })),
      el("h3", {}, "Détail du script"),
      el("button", { class: "puce", onclick: () => { arreterLecture(); choisirScript(id); } }, "ouvrir la fiche de " + id)
    );
  }
  function basculerLecture() {
    if (minuterie) { arreterLecture(); etape(tournee.i); return; }
    minuterie = setInterval(() => {
      if (!tournee || tournee.i >= tournee.p.etapes.length - 1) { arreterLecture(); if (tournee) etape(tournee.i); return; }
      etape(tournee.i + 1);
    }, 1800);
    etape(tournee.i);
  }
  function arreterLecture() { if (minuterie) clearInterval(minuterie); minuterie = null; }

  // ───────────── recherche
  const champ = document.getElementById("recherche"), liste = document.getElementById("suggestions");
  let resultats = [], actif = 0;
  function chercher() {
    const q = champ.value.trim().toLowerCase();
    if (!q) { liste.classList.remove("ouvert"); return; }
    const s = scripts.filter((x) => (x.id + " " + (x.role || "") + " " + (x.fichier || "")).toLowerCase().includes(q)).slice(0, 8)
      .map((x) => ({ type: "script", id: x.id, aide: x.role }));
    const vars = toutesVariables.filter((x) => x.toLowerCase().includes(q)).slice(0, 8)
      .map((x) => ({ type: "variable", id: x, aide: "variable" }));
    resultats = [...s, ...vars]; actif = 0;
    liste.replaceChildren(...resultats.map((r, i) => {
      const b = el("button", { class: i === actif ? "actif" : "", role: "option" }, (r.type === "script" ? "▣ " : "⇢ ") + r.id, el("br"), el("small", {}, tronquer(r.aide || "", 70)));
      b.addEventListener("mousedown", (e) => { e.preventDefault(); valider(r); });
      return b;
    }));
    liste.classList.toggle("ouvert", resultats.length > 0);
  }
  function valider(r) {
    liste.classList.remove("ouvert"); champ.blur();
    if (r.type === "script") { choisirScript(r.id); centrer(r.id); } else choisirVariable(r.id);
  }
  champ.addEventListener("input", chercher);
  champ.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!resultats.length) return;
      actif = (actif + (e.key === "ArrowDown" ? 1 : resultats.length - 1)) % resultats.length;
      [...liste.children].forEach((b, i) => b.classList.toggle("actif", i === actif));
    } else if (e.key === "Enter" && resultats[actif]) { valider(resultats[actif]); }
    else if (e.key === "Escape") { liste.classList.remove("ouvert"); }
  });
  champ.addEventListener("blur", () => setTimeout(() => liste.classList.remove("ouvert"), 120));

  // ───────────── bascules et thème
  const bascules = { "voir-variables": "variables-visibles", "voir-boucles": "sans-boucles", "voir-modele": null };
  function appliquerBascules() {
    svg.classList.toggle("variables-visibles", document.getElementById("voir-variables").checked);
    svg.classList.toggle("sans-boucles", !document.getElementById("voir-boucles").checked);
    const modele = document.getElementById("voir-modele").checked;
    elFlux.forEach(({ f, g }) => { if (f.type === "modele") g.style.display = modele ? "" : "none"; });
  }
  Object.keys(bascules).forEach((id) => {
    const c = document.getElementById(id);
    c.checked = memo.lire(id, c.checked);
    c.addEventListener("change", () => { memo.ecrire(id, c.checked); appliquerBascules(); });
  });
  const racine = document.documentElement;
  const themes = ["systeme", "clair", "sombre"];
  function appliquerTheme(t) {
    if (t === "clair") racine.setAttribute("data-theme", "light");
    else if (t === "sombre") racine.setAttribute("data-theme", "dark");
    else racine.removeAttribute("data-theme");
    document.getElementById("theme").textContent = "Thème : " + t;
  }
  let theme = memo.lire("theme", "systeme");
  appliquerTheme(theme);
  document.getElementById("theme").addEventListener("click", () => {
    theme = themes[(themes.indexOf(theme) + 1) % themes.length]; memo.ecrire("theme", theme); appliquerTheme(theme);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target === champ) return;
    if (e.key === "Escape") { arreterLecture(); effacer(); }
    else if (tournee && e.key === "ArrowRight") etape(tournee.i + 1);
    else if (tournee && e.key === "ArrowLeft") etape(tournee.i - 1);
    else if (e.key === "+") zoomer(1.25);
    else if (e.key === "-") zoomer(0.8);
    else if (e.key === "0") ajuster(null, true);
  });

  // ───────────── démarrage
  document.getElementById("titre").textContent = D.titre;
  document.getElementById("sous-titre").textContent =
    `Version ${D.version} · ${scripts.length} mini-scripts · ${D.flux.filter((f) => f.type === "donnees").length} flux · ${toutesVariables.length} variables`;
  appliquerBascules();
  vueGenerale();
  vueInitiale();
})();
</script>
</body>
</html>
