# Répertoire des disciplines : ce que chacune apporte et les mots qui la signalent.
# « mots_cles » sert à repérer une discipline dans une question (début de mot, sans accents) ;
# « mots_cles_en » sert à formuler les recherches en anglais.
# Ajoutez les disciplines qui vous manquent : l'agent ne peut proposer que ce que ce répertoire,
# votre corpus et le modèle connaissent.

disciplines:
  # ── Esprit et cerveau
  - id: neurosciences_decision
    nom: "Neurosciences de la décision et des valeurs"
    famille: esprit_cerveau
    apporte: "Comment le cerveau représente valeurs, récompenses et convictions ; imagerie cérébrale."
    mots_cles: [cerveau, neuro, irmf, dopamin, recompense]
    mots_cles_en: [decision neuroscience, neural representation of values, fMRI, reward]
  - id: psychologie_sociale
    nom: "Psychologie sociale"
    famille: esprit_cerveau
    apporte: "Influence, normes, identité sociale, changement d'attitude, dissonance."
    mots_cles: [influenc, norme, attitude, dissonance, conformi, identite sociale]
    mots_cles_en: [attitude change, social influence, social identity, cognitive dissonance]
  - id: psychologie_morale
    nom: "Psychologie morale"
    famille: esprit_cerveau
    apporte: "Comment se forment et résistent les convictions morales ; valeurs sacrées ; recadrage moral."
    mots_cles: [moral, valeur, conviction, ethique, sacre]
    mots_cles_en: [moral psychology, moral conviction, sacred values, moral reframing]
  - id: psychologie_clinique
    nom: "Psychologie clinique et psychothérapie"
    famille: esprit_cerveau
    apporte: "Traitements évalués, alliance thérapeutique, entretien motivationnel."
    mots_cles: [therap, trauma, phobi, anxi, depress, clinique]
    mots_cles_en: [psychotherapy, clinical trial, motivational interviewing, exposure therapy]
  - id: psychologie_developpement
    nom: "Psychologie du développement"
    famille: esprit_cerveau
    apporte: "Comment une préférence ou une croyance s'installe au fil de la vie."
    mots_cles: [enfan, adolescen, developpement, apprentissage]
    mots_cles_en: [developmental psychology, socialization, learning]
  - id: sciences_decision
    nom: "Économie comportementale et sciences de la décision"
    famille: esprit_cerveau
    apporte: "Biais, heuristiques, cadrage, aversion à la perte, nudges."
    mots_cles: [biais, heuristi, cadrage, nudge, choix, decision]
    mots_cles_en: [behavioral economics, framing effect, loss aversion, nudge]
  - id: addictologie
    nom: "Addictologie et psychologie de l'habitude"
    famille: esprit_cerveau
    apporte: "Formation et rupture des habitudes, rechutes, envies."
    mots_cles: [habitude, addict, dependan, rechute, envie, sevrage]
    mots_cles_en: [habit formation, relapse, craving, behavior change]

  # ── Vivant
  - id: ethologie
    nom: "Éthologie"
    famille: vivant
    apporte: "Comportement animal et humain comparé ; fonctions et causes des comportements."
    mots_cles: [etholog, animal, instinct, predat, vegan, carniv, omnivor]
    mots_cles_en: [ethology, animal behavior, comparative behavior]
  - id: biologie_evolutive
    nom: "Biologie évolutive et anthropologie biologique"
    famille: vivant
    apporte: "Origine évolutive des comportements (alimentation, coopération, confiance)."
    mots_cles: [evolution, darwin, ancestr, adaptati, vegan, viande, carniv, omnivor]
    mots_cles_en: [evolutionary biology, human evolution, diet evolution]
  - id: nutrition
    nom: "Nutrition et sciences de l'alimentation"
    famille: vivant
    apporte: "Besoins nutritionnels, carences, effets des régimes sur la santé, goût."
    mots_cles: [nutrition, aliment, regime, carence, vitamin, protein, vegan, vegetari, viande]
    mots_cles_en: [nutrition, diet quality, nutrient deficiency, plant-based diet]
  - id: mycologie
    nom: "Mycologie"
    famille: vivant
    apporte: "Espèces de champignons, nomenclature, confusions."
    mots_cles: [champignon, mycolog, amanit, bolet, cepe]
    mots_cles_en: [mycology, mushroom identification, fungal taxonomy]
  - id: toxicologie
    nom: "Toxicologie"
    famille: vivant
    apporte: "Toxines, doses, symptômes, prise en charge des intoxications."
    mots_cles: [toxi, poison, intoxic, dose]
    mots_cles_en: [toxicology, poisoning, toxin]

  # ── Santé
  - id: medecine
    nom: "Médecine clinique"
